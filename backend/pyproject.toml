[project]
name = "chat-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis[hiredis]>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "mypy>=1.11.2",
    "types-redis>=4.6.0",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
src_paths = ["."]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
