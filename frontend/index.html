<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 채팅</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/channels.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

  <!-- 로그인 화면 -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>💬 실시간 채팅</h1>

      <div class="auth-tabs">
        <button id="login-tab-btn" class="tab-btn active" data-tab="login">로그인</button>
        <button id="register-tab-btn" class="tab-btn" data-tab="register">회원가입</button>
      </div>

      <form id="login-form">
        <input
          id="login-email"
          type="email"
          placeholder="이메일"
          maxlength="254"
          autocomplete="email"
        />
        <input
          id="login-password"
          type="password"
          placeholder="비밀번호"
          maxlength="100"
          autocomplete="current-password"
        />
        <p id="login-error" class="auth-error hidden"></p>
        <button type="submit">로그인</button>
      </form>

      <form id="register-form" class="hidden">
        <input
          id="reg-username"
          type="text"
          placeholder="사용자 이름"
          maxlength="20"
          autocomplete="username"
        />
        <input
          id="reg-email"
          type="email"
          placeholder="이메일"
          maxlength="254"
          autocomplete="email"
        />
        <input
          id="reg-password"
          type="password"
          placeholder="비밀번호"
          maxlength="100"
          autocomplete="new-password"
        />
        <p id="register-error" class="auth-error hidden"></p>
        <button type="submit">회원가입</button>
      </form>
    </div>
  </div>

  <!-- Channel Screen -->
  <div id="channel-screen" class="hidden">
    <div class="channel-container">
      <div class="channel-header">
        <h2>채팅 채널</h2>
        <button id="back-to-login-btn" class="back-btn">← 로그아웃</button>
      </div>
      <div class="create-channel-form">
        <input type="text" id="create-channel-name" placeholder="새 채널 이름" maxlength="50" />
        <button id="create-channel-btn">채널 만들기</button>
      </div>
      <div class="channel-list-header">
        <span>채널 목록</span>
        <button id="refresh-channels-btn">새로고침</button>
      </div>
      <div id="channel-list"></div>
    </div>
  </div>

  <!-- 채팅 화면 -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <span class="logo">💬</span>
        <span class="room-name">실시간 채팅방</span>
        <span id="current-channel-name" class="current-channel"></span>
      </div>
      <div class="header-right">
        <span id="online-count" class="online-badge">● 0명 접속중</span>
        <span id="my-name" class="my-name"></span>
        <button id="leave-btn">나가기</button>
      </div>
    </header>

    <main id="messages"></main>

    <footer>
      <input
        id="message-input"
        type="text"
        placeholder="메시지를 입력하세요..."
        maxlength="500"
        autocomplete="off"
      />
      <button id="send-btn">전송</button>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
